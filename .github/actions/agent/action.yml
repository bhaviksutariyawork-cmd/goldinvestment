name: Run gold agent
description: >
  Sets up Python, runs one agent mode, and commits the SQLite state back to the
  branch with a rebase-and-retry so overlapping runs cannot clobber each other.

inputs:
  mode:
    description: morning | evening | weekly | watch | commands | selftest
    required: true
  extra-args:
    description: Additional flags passed to python -m goldagent.run
    required: false
    default: ""
  commit-state:
    description: Whether to commit state/gold.db back to the branch
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run agent (${{ inputs.mode }})
      id: run
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
      run: |
        python -m goldagent.run --mode "${{ inputs.mode }}" ${{ inputs.extra-args }}

    # Runs even when the agent failed: a partially-updated database is still
    # worth keeping, and losing it would make tomorrow's direction data wrong.
    - name: Commit state
      if: ${{ always() && inputs.commit-state == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -f state/gold.db ]; then
          echo "No state file to commit."
          exit 0
        fi

        git config user.name  "gold-agent[bot]"
        git config user.email "gold-agent[bot]@users.noreply.github.com"

        if git diff --quiet -- state/gold.db; then
          echo "State unchanged; nothing to commit."
          exit 0
        fi

        git add state/gold.db
        git commit -m "state: ${{ inputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

        # The state DB is a binary file, so a concurrent run's commit cannot be
        # merged. Rebasing our single state commit onto theirs and re-committing
        # our version is the correct resolution: ours is strictly newer, and the
        # readings it contains are append-only.
        branch="${GITHUB_REF_NAME}"
        for attempt in 1 2 3 4; do
          if git push origin "HEAD:${branch}"; then
            echo "State pushed on attempt ${attempt}."
            exit 0
          fi

          echo "Push rejected (attempt ${attempt}); another run committed first. Rebasing."
          git fetch origin "${branch}"
          # Keep our version of the binary on conflict — it is the newer state.
          if ! git rebase -X ours "origin/${branch}"; then
            git checkout --ours state/gold.db 2>/dev/null || true
            git add state/gold.db 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue || git rebase --abort
          fi
          sleep $((2 ** attempt))
        done

        echo "::warning title=State not committed::Could not push state after 4 attempts."
        echo "The briefing was still delivered. Tomorrow's direction data may be incomplete."
        exit 0
