[project]
name = "goldagent"
version = "1.0.0"
description = "Gold market intelligence briefings delivered to Telegram"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["goldagent", "collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so `goldagent` and `collectors` import without an install.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    # yfinance is noisy about pandas internals; not our problem.
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in default arg — used deliberately for clock injection
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
